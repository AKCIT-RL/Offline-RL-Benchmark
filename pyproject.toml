[project]
name = "offline-rl-benchmark"
version = "0.1.0"
description = "Data collection for the offline RL benchmark on MuJoCo Playground"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]==0.6.0",
    "mediapy==1.2.4",
    "minari[all]==0.5.3",
    "pyrallis==0.3.1",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "brax==0.14.2",
    "gymnasium==1.3.0",
    "etils==1.14.0",
    "playground",
    # Pinned to the warp-compatible set: mujoco-mjx 3.6.0 imports the warp GraphMode
    # from `warp.jax_experimental.ffi`, which matches warp-lang 1.11.0. Newer
    # mujoco-mjx (>=3.7) import `warp._src.jax_experimental.ffi`, a path not exposed
    # by any released warp-lang, which breaks impl="warp".
    "mujoco==3.6.0",
    "mujoco-mjx==3.6.0",
    "warp-lang==1.11.0",
    # numpy 2.5 made npt.NDArray a non-subclassable TypeAliasType, which breaks
    # mediapy's `class _VideoArray(npt.NDArray)`. Cap below 2.5 until mediapy fixes it.
    "numpy<2.5",
]

[tool.uv]
# minari declares `typer[all]`, but typer removed the `all` extra (the base
# package now bundles everything). Override to drop the non-existent extra and
# silence uv's resolution warning.
override-dependencies = ["typer>=0.20.0"]

[[tool.uv.index]]
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
playground = { git = "https://github.com/ANONYMOUS/mujoco_playground.git", rev = "go2" }
